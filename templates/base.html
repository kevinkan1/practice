<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sistem Informasi Mahasiswa{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="nav">
    <a href="/" class="brand">SIM Mahasiswa</a>
    <nav class="nav-links">
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Beranda</a>
      <a href="/mahasiswa" class="{% if request.url.path == '/mahasiswa' %}active{% endif %}">Data mahasiswa</a>
      <a href="/insert" class="{% if request.url.path == '/insert' %}active{% endif %}">Tambah</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>

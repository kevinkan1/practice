{% extends "base.html" %}
{% block title %}Ubah mahasiswa{% endblock %}
{% block content %}
<div class="head"><h2>Ubah data mahasiswa</h2></div>
<form method="post" action="/edit/{{ mahasiswa[0] }}" class="card form">
  <div class="field">
    <label for="nim">NIM</label>
    <input id="nim" value="{{ mahasiswa[0] }}" readonly>
  </div>
  <div class="field">
    <label for="nama">Nama lengkap</label>
    <input id="nama" name="nama" value="{{ mahasiswa[1] }}" required autofocus>
  </div>
  <div class="grid3 field">
    <div><label for="tugas">Tugas</label><input id="tugas" name="tugas" type="number" step="0.01" min="0" max="100" value="{{ mahasiswa[2] }}" required></div>
    <div><label for="uts">UTS</label><input id="uts" name="uts" type="number" step="0.01" min="0" max="100" value="{{ mahasiswa[3] }}" required></div>
    <div><label for="uas">UAS</label><input id="uas" name="uas" type="number" step="0.01" min="0" max="100" value="{{ mahasiswa[4] }}" required></div>
  </div>
  <div class="actions">
    <button type="submit" class="btn primary">Simpan perubahan</button>
    <a href="/mahasiswa" class="btn">Batal</a>
  </div>
</form>
{% endblock %}
